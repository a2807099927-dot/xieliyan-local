<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>写梨眼</title>
  <style>
    /* 防止 React render 前 webview 露出 WebView2 默认白底 */
    html, body { background: #040a1b; margin: 0; padding: 0; overflow: hidden; }
    #root { background: #040a1b; min-height: 100vh; position: relative; z-index: 1; }
    /* 启动加载指示器：React 渲染后 #root 内容覆盖此层 */
    #splash {
      position: fixed; inset: 0; z-index: 0;
      display: flex; align-items: center; justify-content: center;
      background: #040a1b;
    }
    #splash::after {
      content: '';
      width: 32px; height: 32px;
      border: 3px solid rgba(139, 92, 246, 0.2);
      border-top-color: rgba(139, 92, 246, 0.8);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="wz-body-host dark">
  <div id="splash"></div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
<script>window.addEventListener("error", function(e) { fetch("http://127.0.0.1:5173/error_log", { method: "POST", body: e.message + " " + e.filename + ":" + e.lineno }); }); window.addEventListener("unhandledrejection", function(e) { fetch("http://127.0.0.1:5173/error_log", { method: "POST", body: e.reason }); });</script>
