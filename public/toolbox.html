<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>工具箱</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #040a1b;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      user-select: none;
      overflow: hidden;
      border-radius: 12px;
    }
    .container {
      padding: 16px;
      background: linear-gradient(165deg, #0a0f1e 0%, #0d1528 100%);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 0 12px 12px 0;
      height: 100%;
      box-sizing: border-box;
    }
    .title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .close-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.4);
      font-size: 16px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      line-height: 1;
    }
    .close-btn:hover {
      background: rgba(244,63,94,0.2);
      color: #fecdd3;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 12px 8px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      background: rgba(255,255,255,0.03);
      cursor: pointer;
      transition: all 0.15s;
    }
    .item:hover {
      background: rgba(99,102,241,0.12);
      border-color: rgba(99,102,241,0.3);
      color: #c4b5fd;
    }
    .item.active {
      background: rgba(99,102,241,0.18);
      border-color: rgba(99,102,241,0.4);
      color: #a5b4fc;
    }
    .item svg { width: 22px; height: 22px; }
    .item span {
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">
      工具箱
      <button class="close-btn" onclick="closeToolbox()">&times;</button>
    </div>
    <div class="grid">
      <div class="item" data-action="aiweb">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span>AI 网页</span>
      </div>
      <div class="item" data-action="novel-lab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>小说实验室</span>
      </div>
      <div class="item" data-action="mind">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        <span>思维市场</span>
      </div>
      <div class="item" data-action="book-sweeper">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        <span>网文风向标</span>
      </div>
      <div class="item" data-action="outline-board">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg>
        <span>大纲看板</span>
      </div>
    </div>
  </div>
  <script>
    function closeToolbox() {
      try {
        var tauri = window.__TAURI__;
        if (tauri && tauri.core && typeof tauri.core.invoke === 'function') {
          tauri.core.invoke('toolbox_hide').catch(function(err) { console.error('hide error:', err); });
        }
      } catch(e) { console.error('closeToolbox error:', e); }
    }

    document.querySelectorAll('.item').forEach(function(el) {
      el.addEventListener('click', function() {
        var action = el.getAttribute('data-action');
        if (!action) return;
        try {
          var tauri = window.__TAURI__;
          if (tauri && tauri.core && typeof tauri.core.invoke === 'function') {
            tauri.core.invoke('toolbox_action', { action: action }).catch(function(err) { console.error('action error:', err); });
          }
        } catch(e) { console.error('item click error:', e); }
      });
    });
  </script>
</body>
</html>
